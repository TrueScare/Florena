name: User Story
description: Neue User Story erfassen
title: "[Story] "
labels: ["user-story"]
body:
    - type: textarea
      id: user_story
      attributes:
          label: User Story
          description: Beschreibe die Anforderung aus Nutzerperspektive.
          placeholder: "Als [Rolle] möchte ich [Ziel], damit [Nutzen]."
      validations:
          required: true

    - type: textarea
      id: akzeptanzkriterien
      attributes:
          label: Akzeptanzkriterien
          description: Wann gilt diese Story als erfüllt?
          placeholder: |
              - [ ] Kriterium 1
              - [ ] Kriterium 2
              - [ ] Kriterium 3
      validations:
          required: true
